<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Hundred List</h2>
    <ul>
        <li>Task 1</li>
        <li>Task 2</li>
    </ul>
    <hr>
    <ul type="circle">
        <li>Task 3</li>
        <li>Task 4</li>
    </ul>
    <ul type="square">
        <li>Task 4.1</li>
        <li>Task 4.2</li>
    </ul>
    <li>Task 5</li>
    <ul type=""none>
        <li>Task 5.1</li>
    </ul>
    <hr>
    <h2>Ordered List</h2>
    <ol>
        <li>Task 1</li>
        <li>Task 2</li>
    </ol>
    <hr>
    <ol type="A">
        <li>Task 3</li>
        <ol type="I" start="3">
            <li>Task 3.1</li>
            <li>Task 3.2</li>
            <ol type="a" start="4">
                <li>Task 3.2.1</li>
                <li>Task 3.2.2</li>
            </ol>
            <li>Task 3.3</li>
        </ol> 
    </ol>
</body>
</html>
